name: Build and publish Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the AppImage to (e.g. v4.0.1)'
        required: true
        type: string
        default: 'v4.0.1'
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag to attach the AppImage to'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-appimage-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build frozen Linux binary
        run: python -m PyInstaller --noconfirm --clean Packager.spec
      - name: Check frozen NSP builds
        run: python frozen_smoke.py
      - name: Check frozen NUP tools
        run: python frozen_nup_smoke.py --executable dist/NSP-Box
      - name: Assemble AppDir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/NSP-Box AppDir/usr/bin/NSP-Box
          chmod +x AppDir/usr/bin/NSP-Box
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('src/assets/icons/app.png')
          target = Path('AppDir/usr/share/icons/hicolor/256x256/apps/nsp-box.png')
          with Image.open(source) as image:
              image.convert('RGBA').resize((256, 256), Image.Resampling.LANCZOS).save(target)
          PY
          cat > AppDir/usr/share/applications/nsp-box.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NSP Box
          Comment=Rebuild complete extracted game snapshots
          Exec=NSP-Box
          Icon=nsp-box
          Categories=Utility;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/NSP-Box" "$@"
          EOF
          chmod +x AppDir/AppRun
          ln -sf usr/share/icons/hicolor/256x256/apps/nsp-box.png AppDir/.DirIcon
      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import engine; print(engine.VERSION)")
          asset="NSP-Box-v${version}-Linux-x64.AppImage"
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "$asset"
          file "$asset"
          mkdir -p verify
          (cd verify && "../$asset" --appimage-extract >/dev/null)
          test -x verify/squashfs-root/usr/bin/NSP-Box
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir . --repo "$GH_REPO"
          grep -v 'AppImage' SHA256SUMS.txt > SHA256SUMS.txt.new || true
          mv SHA256SUMS.txt.new SHA256SUMS.txt
          sha256sum "$ASSET" >> SHA256SUMS.txt
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GH_REPO"
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GH_REPO"
          gh release view "$TAG" --repo "$GH_REPO"
